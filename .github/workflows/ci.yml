name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --features gui --all-targets
      - name: Test (with GUI, including doctests)
        run: cargo test --locked --features gui
      - name: Test (CLI only)
        run: cargo test --locked

  # Pinned, so a new Rust release can't add lints and fail the build on its
  # own; bump it on purpose and fix what it reports.
  lint:
    runs-on: ubuntu-24.04
    env:
      LINT_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - run: rustup toolchain install "$LINT_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +"$LINT_TOOLCHAIN" fmt --check
      - run: cargo +"$LINT_TOOLCHAIN" clippy --locked --features gui --all-targets -- -D warnings
      - run: cargo +"$LINT_TOOLCHAIN" clippy --locked --all-targets -- -D warnings

  appimage:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev desktop-file-utils
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Get appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build AppImage
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/linux/build_appimage.sh
      - name: Smoke test
        # colmap-studio always opens a window, so only the CLI is run here.
        run: |
          ./COLMAP-Rust-Studio-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/colmap-studio
          test -x squashfs-root/usr/bin/colmap-launcher
          squashfs-root/usr/bin/colmap-launcher --help
      - name: Checksum
        run: sha256sum COLMAP-Rust-Studio-x86_64.AppImage | tee COLMAP-Rust-Studio-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: COLMAP-Rust-Studio-x86_64.AppImage
          path: |
            COLMAP-Rust-Studio-x86_64.AppImage
            COLMAP-Rust-Studio-x86_64.AppImage.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "COLMAP Rust Studio $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --clobber \
            COLMAP-Rust-Studio-x86_64.AppImage COLMAP-Rust-Studio-x86_64.AppImage.sha256
