[package]
name = "colmap-launcher"
version = "0.1.0"
edition = "2024"

[features]
gui = ["dep:eframe", "dep:rfd", "dep:ksni"]

[dependencies]
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["glow", "default_fonts", "accesskit"] }
rfd = { version = "=0.17.2", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux/BSD desktop backends: native Wayland + X11 windows, and XDG desktop
# portal file dialogs (no GTK development headers needed).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["wayland", "x11"] }
rfd = { version = "=0.17.2", optional = true, default-features = false, features = ["xdg-portal", "wayland"] }

# Background tray process for colmap-studio (StatusNotifierItem over D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "tokio"] }

[[bin]]
name = "colmap-studio"
path = "src/bin/studio.rs"
required-features = ["gui"]
