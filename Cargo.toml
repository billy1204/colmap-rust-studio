[package]
name = "colmap-launcher"
version = "0.1.0"
edition = "2024"

[features]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["glow", "default_fonts", "accesskit"] }
rfd = { version = "=0.17.2", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[[bin]]
name = "colmap-studio"
path = "src/bin/studio.rs"
required-features = ["gui"]
